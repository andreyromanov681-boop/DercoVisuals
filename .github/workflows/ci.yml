name: Build DercoVisuals

concurrency:
  group: dercovisuals-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and build
        run: gradle build --no-daemon
      - name: Publish rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name 'DercoVisuals-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$JAR"
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$JAR" --clobber
            gh release edit latest --title "DercoVisuals latest build" --notes "Automatically built from main at $GITHUB_SHA."
          else
            gh release create latest "$JAR" --title "DercoVisuals latest build" --notes "Automatically built from main at $GITHUB_SHA."
          fi
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DercoVisuals-build
          path: build/libs/DercoVisuals-*.jar
          if-no-files-found: error
