name: Build DercoVisuals Pulse foundation

concurrency:
  group: dercovisuals-pulse-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, pulse-foundation]
  pull_request:
    branches: [main, pulse-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Generate DercoVisuals sources from Pulse foundation
        run: python3 tools/prepare_pulse_foundation.py
      - name: Upload generated Java sources for migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DercoVisuals-generated-java-${{ github.sha }}
          path: src/main/java/
          if-no-files-found: error
          retention-days: 1
      - name: Compile and build
        run: gradle build --no-daemon
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DercoVisuals-pulse-foundation
          path: build/libs/DercoVisuals-*.jar
          if-no-files-found: error
